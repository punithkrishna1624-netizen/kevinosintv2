<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KevinOSINT — Sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="scanlines"></div>
<div class="login-wrap">
  <div class="login-card">
    <img src="{{ url_for('static', filename='kevin-avatar.jpeg') }}" alt="" class="login-avatar">
    <div class="brand-name">KEVIN<span>OSINT</span></div>
    <small>ACCESS CODE REQUIRED</small>
    <form method="post">
      <input type="password" name="code" placeholder="Access code" autofocus required>
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      <button type="submit">ENTER →</button>
    </form>
    <p class="login-note">Authorized users only — usage is logged.</p>
  </div>
</div>
</body>
</html>
